name: Release

# Publish a GitHub Release for a version like `v1.0.0`. Either push the tag, or run
# this workflow by hand from the Actions tab on `main` with the tag name: the tag
# is then created on the current `main` commit. The tag must match the version in
# Cargo.toml, and CHANGELOG.md must have a section for it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0 (created on this commit if it does not exist)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    # A manual run may only release from `main`.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --examples --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "::error::no CHANGELOG.md section for $version"
            exit 1
          fi
          {
            echo "![egui-flow tour](https://github.com/${GITHUB_REPOSITORY}/raw/${TAG}/docs/media/tour.gif)"
            echo
            cat section.md
            echo
            echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md"
          } > notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # A pushed tag must already exist; a manual run creates it on this commit.
          if [ "${{ github.event_name }}" = "push" ]; then
            flags="$flags --verify-tag"
          else
            flags="$flags --target $GITHUB_SHA"
          fi
          gh release create "$TAG" \
            --title "egui-flow $TAG" \
            --notes-file notes.md \
            $flags
